name: ai-video-studio
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  minio:
    profiles: ["s3-local"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: [minio_data:/data]
    restart: unless-stopped
    logging: *logging
  migrate:
    image: ${STUDIO_IMAGE:-ai-video-studio:local}
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && node scripts/setup-rls.mjs"]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging
  web:
    image: ${STUDIO_IMAGE:-ai-video-studio:local}
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio}?schema=public
      TENANT_DATABASE_URL: postgresql://studio_tenant:${TENANT_DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-studio}?schema=public
      RLS_REQUIRED: "true"
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/data/storage
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes: [media_data:/app/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
  worker:
    image: ${STUDIO_IMAGE:-ai-video-studio:local}
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/data/storage
      RENDER_TMP_DIR: /app/data/render
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    command: ["npm", "run", "worker:production"]
    volumes: [media_data:/app/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15m
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
